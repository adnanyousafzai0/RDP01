      "text": "A disaster so devastating… that it pushed an entire city into the shadow of death.\n\nRubble, screams, and destruction were everywhere… yet some people were still fighting to survive.\n\nAmid the chaos, a police officer sets out to save those trapped in the disaster. Every step is dangerous… and every second could mean the difference between life and death.\n\nBut the real fear begins when they realize… this is not just an accident.\n\nNow, there is only one question—will they survive this destruction?\n\nOr will hope itself… disappear in the flames?\n",
